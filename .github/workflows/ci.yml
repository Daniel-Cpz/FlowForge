name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLOWFORGE_TEST_POSTGRES_URL: postgres://flowforge:ci-only-ephemeral-password@localhost:5432/flowforge?sslmode=disable
      FLOWFORGE_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sh scripts/check.sh
      - run: go test -race -count=1 ./internal/realtime ./internal/observability ./internal/infrastructure/... ./internal/service/... ./internal/transport/... ./tests/integration
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck && npm test -- --run && npm run build
        working-directory: web
      - name: Observability configurations
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observability:/config:ro" prom/prometheus:v3.5.0 check config /config/prometheus.yml
          docker run --rm -v "$PWD/observability:/config:ro" otel/opentelemetry-collector:0.133.0 validate --config=/config/otel-collector.yml
          python -c 'import json; d=json.load(open("observability/grafana/dashboards/flowforge.json")); assert d["uid"]=="flowforge-overview" and len(d["panels"])>=15'
      - name: Harness safety
        shell: pwsh
        run: ./scripts/test-phase9-harness.ps1
      - name: Production deployment state machine
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release-images.yml .github/workflows/deploy.yml
          for file in deploy/scripts/*.sh deploy/tests/*.sh; do bash -n "$file"; done
          bash deploy/tests/state-machine.sh
          bash deploy/tests/remote-safety.sh
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Production config / workflow safety
        run: |
          python -m pip install PyYAML==6.0.2
          python deploy/tests/config-safety.py
      - name: Isolated production image / TLS / gateway / restore smoke
        env:
          FLOWFORGE_RELEASE_SHA: ${{ github.sha }}
        run: python deploy/tests/production-stack.py
