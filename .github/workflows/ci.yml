name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLOWFORGE_TEST_POSTGRES_URL: postgres://flowforge:ci-only-ephemeral-password@localhost:5432/flowforge?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sh scripts/check.sh
