# Disposable Phase 9 harness only. No retained volumes or production endpoints.
name: ${PHASE9_PROJECT:?generated project required}
x-env: &env
  FLOWFORGE_ENV: test
  FLOWFORGE_POSTGRES_HOST: postgres
  FLOWFORGE_POSTGRES_PASSWORD: ${PHASE9_PASSWORD:?generated password required}
  FLOWFORGE_POSTGRES_DB: phase9
  FLOWFORGE_REDIS_ADDR: redis:6379
  FLOWFORGE_REDIS_STREAM: ${PHASE9_STREAM:?generated namespace required}
  FLOWFORGE_METRICS_ENABLED: "true"
  FLOWFORGE_OTEL_ENABLED: ${PHASE9_TRACING:-false}
  FLOWFORGE_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  FLOWFORGE_OTEL_SAMPLE_RATIO: "1"
  FLOWFORGE_WORKER_CONCURRENCY: "1"
  FLOWFORGE_LEASE_SECONDS: "3"
  FLOWFORGE_RENEW_SECONDS: "1"
  FLOWFORGE_HEARTBEAT_SECONDS: "1"
  FLOWFORGE_OFFLINE_SECONDS: "4"
  FLOWFORGE_LOG_LEVEL: ${PHASE9_LOG_LEVEL:-WARN}
services:
  postgres:
    image: postgres:18-alpine
    command: [postgres, -c, max_connections=300]
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${PHASE9_PASSWORD}
      POSTGRES_DB: phase9
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U flowforge -d phase9]
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
  migrate:
    image: flowforge-phase9-experiment
    environment: *env
    command: [/app/migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: flowforge-phase9-experiment
    environment: *env
    ports: ["127.0.0.1::8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    image: flowforge-phase9-experiment
    environment: *env
    command: [/app/worker]
    ports: ["127.0.0.1::9091"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  loadgen:
    image: flowforge-phase9-experiment
    entrypoint: [/app/loadgen]
    profiles: [tools]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    tmpfs: ["/prometheus:uid=65534,gid=65534,mode=1777"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1::9090"]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    tmpfs: ["/var/lib/grafana:uid=472,gid=0,mode=1777"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1::3000"]
  otel-collector:
    image: otel/opentelemetry-collector:0.133.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yml:/etc/otelcol/config.yaml:ro"]
